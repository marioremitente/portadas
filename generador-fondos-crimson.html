<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fondos Crimson Desert · MoringosTV</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--card:#121a2e;--line:#243050;--tx:#e9edf7;--mut:#8f9bb8;--ac:#ffd400}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif;display:grid;grid-template-columns:350px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:18px;overflow:auto;max-height:100vh;position:sticky;top:0}
main{padding:20px;min-width:0}
h1{font:26px/1 Anton,sans-serif;margin:0 0 4px;letter-spacing:.5px}
.sub{color:var(--mut);margin:0 0 8px}
h2{font:600 13px Inter;margin:20px 0 2px;color:var(--ac)}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:13px}
input,select,button{width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=range]{padding:0}input[type=checkbox]{width:auto;padding:0}
button{background:var(--ac);color:#000;font-weight:600;cursor:pointer;border:0;margin-top:10px}
button.s{background:transparent;color:var(--tx);border:1px solid var(--line)}
canvas{width:100%;height:auto;border-radius:8px;background:#000;display:block}
.row{display:flex;gap:8px}.row>*{flex:1}
a{color:var(--ac)}
#st{margin:12px 0;min-height:20px;color:var(--mut)}
@media(max-width:900px){body{grid-template-columns:1fr}aside{position:static;max-height:none;border-right:0}}
</style>
</head>
<body>
<aside>
  <h1>Fondos Crimson Desert</h1>
  <p class="sub">Sin IA y sin servidor. <a href="index.html">← Volver a miniaturas</a></p>

  <label for="modo">Modo</label>
  <select id="modo">
    <option value="cap">1 · Filtro sobre mi captura</option>
    <option value="scene">2 · Escena procedural</option>
  </select>

  <div id="g1">
    <h2>Captura</h2>
    <label for="file">Sube una captura de tu propio gameplay</label>
    <input id="file" type="file" accept="image/*">
    <label for="zoom">Zoom</label><input id="zoom" type="range" min="100" max="180" value="110">
    <label for="foco">Encuadre horizontal (izquierda ↔ derecha)</label><input id="foco" type="range" min="0" max="100" value="50">
    <label for="cont">Contraste</label><input id="cont" type="range" min="80" max="160" value="115">
    <label for="sat">Saturación</label><input id="sat" type="range" min="60" max="180" value="110">
    <label for="bril">Brillo</label><input id="bril" type="range" min="60" max="130" value="95">
    <label for="calor">Calor (tinte rojo/naranja)</label><input id="calor" type="range" min="0" max="100" value="40">
    <label for="blur">Desenfoque de bordes</label><input id="blur" type="range" min="0" max="30" value="8">
  </div>

  <div id="g2" style="display:none">
    <h2>Escena</h2>
    <label for="hora">Hora del día</label>
    <select id="hora"><option value="atardecer">Atardecer</option><option value="amanecer">Amanecer</option><option value="noche">Noche</option></select>
    <label for="capas">Capas de montañas</label><input id="capas" type="range" min="2" max="6" value="5">
    <label class="ck"><input id="castillo" type="checkbox" checked> Castillo en la colina</label>
    <label for="seed">Semilla (misma semilla = misma escena)</label>
    <div class="row"><input id="seed" type="number" value="1234"><button id="btnSeed" class="s" type="button" style="margin-top:0">Aleatoria</button></div>
  </div>

  <h2>Efectos (ambos modos)</h2>
  <label for="rayos">Rayos de luz</label><input id="rayos" type="range" min="0" max="100" value="50">
  <label for="niebla">Niebla</label><input id="niebla" type="range" min="0" max="100" value="40">
  <label for="brasas">Brasas y chispas</label><input id="brasas" type="range" min="0" max="100" value="60">
  <label for="vig">Viñeta</label><input id="vig" type="range" min="0" max="100" value="60">
  <label for="grano">Grano</label><input id="grano" type="range" min="0" max="100" value="30">
  <label for="semE">Semilla de efectos</label><input id="semE" type="number" value="7">

  <button id="btnSend" type="button">Enviar a miniaturas</button>
  <button id="btnDl" type="button" class="s">Descargar PNG 1920×1080</button>
</aside>

<main>
  <canvas id="cv" aria-label="Vista previa del fondo"></canvas>
  <div id="st" role="status"></div>
</main>

<script>
const $=id=>document.getElementById(id),W=1920,H=1080,cv=$('cv'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
const st=m=>$('st').textContent=m;
const ls={set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const loadImg=f=>new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=URL.createObjectURL(f)});
let cap=null;

const PAL={
  atardecer:{top:'#2b0f1f',mid:'#9a2e1a',bot:'#ff8a2e',sun:'#ffd9a0',haze:[255,140,70],dark:[12,6,10]},
  amanecer:{top:'#1a2245',mid:'#b5566c',bot:'#ffb86e',sun:'#fff0c0',haze:[255,190,130],dark:[14,10,22]},
  noche:{top:'#02040c',mid:'#0f1830',bot:'#3b2b3c',sun:'#e4ecff',haze:[120,110,160],dark:[3,4,10]}
};
const gcv=document.createElement('canvas');gcv.width=gcv.height=256;
{const x=gcv.getContext('2d'),d=x.createImageData(256,256);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
 x.putImageData(d,0,0)}

function castle(x,y,s,col){
  ctx.fillStyle=col;
  const b=(bx,w,h)=>ctx.fillRect(x+bx*s,y-h*s,w*s,h*s+4);
  const roof=(bx,w,h,rh)=>{ctx.beginPath();ctx.moveTo(x+(bx-2)*s,y-h*s);ctx.lineTo(x+(bx+w/2)*s,y-(h+rh)*s);ctx.lineTo(x+(bx+w+2)*s,y-h*s);ctx.fill()};
  b(-60,120,50);b(-70,28,95);roof(-70,28,95,34);b(42,28,85);roof(42,28,85,30);b(-14,28,125);roof(-14,28,125,44);
  for(let i=0;i<6;i++)ctx.fillRect(x+(-60+i*20)*s,y-58*s,10*s,8*s);
}

function scene(r){
  const hora=$('hora').value,P=PAL[hora],sx=W*.72,sy=H*.5;
  let g=ctx.createLinearGradient(0,0,0,H*.75);
  g.addColorStop(0,P.top);g.addColorStop(.55,P.mid);g.addColorStop(1,P.bot);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(hora==='noche')for(let i=0;i<220;i++){ctx.fillStyle=`rgba(255,255,255,${r()*.8})`;ctx.fillRect(r()*W,r()*H*.55,1+r()*1.6,1+r()*1.6)}
  g=ctx.createRadialGradient(sx,sy,0,sx,sy,H*.8);
  g.addColorStop(0,P.sun+'cc');g.addColorStop(.15,P.sun+'66');g.addColorStop(1,P.sun+'00');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=P.sun;ctx.beginPath();ctx.arc(sx,sy,hora==='noche'?70:95,0,7);ctx.fill();

  const n=+$('capas').value,ridges=[],cols=[];
  for(let i=0;i<n;i++){
    const t=i/(n-1),u=Math.pow(t,.7);
    const base=H*(.52+t*.3),amp=70+t*60+r()*40;
    const ph=[r()*9,r()*9,r()*9],fr=[.0021+r()*.001,.0058+r()*.002,.014+r()*.005];
    const y=x=>base+Math.sin(x*fr[0]+ph[0])*amp+Math.sin(x*fr[1]+ph[1])*amp*.45+Math.sin(x*fr[2]+ph[2])*amp*.18;
    const c=P.haze.map((h,j)=>Math.round(h*.4*(1-u)+P.dark[j]*u));
    ridges.push(y);cols.push(`rgb(${c})`);
    ctx.fillStyle=cols[i];ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=8)ctx.lineTo(x,y(x));
    ctx.lineTo(W,H);ctx.fill();
    if(i===n-2&&$('castillo').checked)castle(W*.56,y(W*.56)+6,1.7,`rgb(${c.map(v=>Math.round(v*.7))})`);
    if(i<n-1){
      const f=ctx.createLinearGradient(0,base-60,0,base+240);
      f.addColorStop(0,`rgba(${P.haze},0)`);f.addColorStop(.45,`rgba(${P.haze},.22)`);f.addColorStop(1,`rgba(${P.haze},0)`);
      ctx.fillStyle=f;ctx.fillRect(0,base-60,W,300);
    }
  }
}

function capture(){
  const z=$('zoom').value/100,f=$('foco').value/100;
  const r=Math.max(W/cap.width,H/cap.height)*z,w=cap.width*r,h=cap.height*r,x=(W-w)*f,y=(H-h)*.5;
  const b=document.createElement('canvas');b.width=W;b.height=H;const bx=b.getContext('2d');
  bx.filter=`contrast(${$('cont').value}%) saturate(${$('sat').value}%) brightness(${$('bril').value}%)`;
  bx.drawImage(cap,x,y,w,h);bx.filter='none';
  const calor=$('calor').value/100;
  if(calor){bx.globalCompositeOperation='soft-light';bx.fillStyle=`rgba(255,90,20,${calor*.6})`;bx.fillRect(0,0,W,H);bx.globalCompositeOperation='source-over'}
  const bl=+$('blur').value;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(bl>0){
    ctx.filter=`blur(${bl}px)`;ctx.drawImage(b,-bl*2,-bl*2,W+bl*4,H+bl*4);ctx.filter='none';
    const s=document.createElement('canvas');s.width=W;s.height=H;const sx=s.getContext('2d');
    sx.drawImage(b,0,0);sx.globalCompositeOperation='destination-in';
    const g=sx.createRadialGradient(W*.6,H*.5,H*.3,W*.6,H*.5,H*.95);
    g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');sx.fillStyle=g;sx.fillRect(0,0,W,H);
    ctx.drawImage(s,0,0);
  }else ctx.drawImage(b,0,0);
}

function overlays(mode){
  const R=rng(+$('semE').value||1);
  const ray=+$('rayos').value,fog=+$('niebla').value,emb=+$('brasas').value,vig=+$('vig').value,gr=+$('grano').value;
  const ox=mode==='scene'?W*.72:W*.8,oy=mode==='scene'?H*.5:-80;
  if(ray){
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=0;i<10;i++){
      const a=Math.PI*(.45+R()*.5),w=.03+R()*.05,L=2400;
      const gd=ctx.createLinearGradient(ox,oy,ox+Math.cos(a)*L,oy+Math.sin(a)*L);
      gd.addColorStop(0,`rgba(255,200,130,${ray/100*.18})`);gd.addColorStop(1,'rgba(255,200,130,0)');
      ctx.fillStyle=gd;ctx.beginPath();ctx.moveTo(ox,oy);
      ctx.lineTo(ox+Math.cos(a-w)*L,oy+Math.sin(a-w)*L);ctx.lineTo(ox+Math.cos(a+w)*L,oy+Math.sin(a+w)*L);ctx.fill();
    }
    ctx.restore();
  }
  if(fog)for(let i=0;i<6;i++){
    const x=R()*W,y=H*(.55+R()*.4),rx=500+R()*500,ry=60+R()*90;
    ctx.save();ctx.translate(x,y);ctx.scale(1,ry/rx);
    const gd=ctx.createRadialGradient(0,0,0,0,0,rx);
    gd.addColorStop(0,`rgba(240,200,170,${fog/100*.28})`);gd.addColorStop(1,'rgba(240,200,170,0)');
    ctx.fillStyle=gd;ctx.fillRect(-rx,-rx,2*rx,2*rx);ctx.restore();
  }
  const n=Math.round(emb*3);
  for(let i=0;i<n;i++){
    const x=R()*W,y=H*(1-R()*R()*.95),rad=1+R()*R()*5,t=R();
    ctx.save();ctx.shadowColor='#ff9a3c';ctx.shadowBlur=12;
    ctx.fillStyle=`rgba(255,${Math.round(90+t*130)},${Math.round(20+t*60)},${.4+R()*.6})`;
    ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();ctx.restore();
  }
  if(vig){
    const g=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.72);
    g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${vig/100})`);
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  if(gr){ctx.save();ctx.globalAlpha=gr/100*.25;ctx.globalCompositeOperation='overlay';ctx.fillStyle=ctx.createPattern(gcv,'repeat');ctx.fillRect(0,0,W,H);ctx.restore()}
}

function draw(){
  const mode=$('modo').value;
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.filter='none';
  if(mode==='scene')scene(rng(+$('seed').value||1));
  else if(cap)capture();
  else{
    ctx.fillStyle='#1a0d10';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#8f9bb8';ctx.font='48px Inter,sans-serif';ctx.textAlign='center';
    ctx.fillText('Sube una captura de Crimson Desert',W/2,H/2);ctx.textAlign='left';return;
  }
  overlays(mode);
}

document.querySelectorAll('aside input,aside select').forEach(e=>{
  if(e.type==='file')return;
  e.addEventListener('input',()=>{
    if(e.id==='modo'){$('g1').style.display=e.value==='cap'?'block':'none';$('g2').style.display=e.value==='scene'?'block':'none'}
    draw();
  });
});
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;cap=await loadImg(f);draw();st('Captura cargada.')});
$('btnSeed').onclick=()=>{$('seed').value=Math.floor(Math.random()*1e6);draw()};
$('btnDl').onclick=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fondo-crimson-desert.png';a.click()},'image/png');
$('btnSend').onclick=()=>{
  if($('modo').value==='cap'&&!cap){st('Sube primero una captura.');return}
  if(ls.set('fondoGenerado',cv.toDataURL('image/jpeg',.88)))location.href='index.html';
  else st('Es demasiado grande para enviarlo. Descarga el PNG y súbelo en miniaturas.');
};
draw();
</script>
</body>
</html>
